<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>問い合わせ登録</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container narrow">
    <header class="page-header">
        <div>
            <p class="eyebrow">NEW INQUIRY</p>
            <h1>問い合わせ登録</h1>
        </div>
        <a class="link-button" th:href="@{/inquiries}">一覧へ戻る</a>
    </header>

    <form class="card form" th:action="@{/inquiries}" th:object="${inquiryForm}" method="post">
        <label>
            件名
            <input type="text" th:field="*{title}" maxlength="120">
            <span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
        </label>

        <label>
            内容
            <textarea th:field="*{content}" rows="8" maxlength="2000"></textarea>
            <span class="error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></span>
        </label>

        <label>
            ステータス
            <select th:field="*{status}">
                <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.label}"></option>
            </select>
            <span class="error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
        </label>

        <div class="actions">
            <button class="button primary" type="submit">登録する</button>
            <a class="link-button" th:href="@{/inquiries}">キャンセル</a>
        </div>
    </form>
</main>
</body>
</html>
