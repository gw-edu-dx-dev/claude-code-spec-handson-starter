<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>問い合わせ一覧</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container">
    <header class="page-header">
        <div>
            <p class="eyebrow">INQUIRY MANAGEMENT</p>
            <h1>問い合わせ一覧</h1>
        </div>
        <a class="button primary" th:href="@{/inquiries/new}">新規登録</a>
    </header>

    <form class="filters" method="get" th:action="@{/inquiries}">
        <label>
            キーワード
            <input type="search" name="keyword" th:value="${keyword}" placeholder="件名・内容を検索">
        </label>
        <label>
            ステータス
            <select name="status">
                <option value="">すべて</option>
                <option th:each="s : ${statuses}"
                        th:value="${s.name()}"
                        th:text="${s.label}"
                        th:selected="${selectedStatus == s}"></option>
            </select>
        </label>
        <button class="button" type="submit">絞り込む</button>
        <a class="link-button" th:href="@{/inquiries}">クリア</a>
    </form>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>件名</th>
                <th>内容</th>
                <th>ステータス</th>
                <th>登録日時</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(inquiries)}">
                <td colspan="5" class="empty">条件に一致する問い合わせはありません。</td>
            </tr>
            <tr th:each="inquiry : ${inquiries}">
                <td th:text="${inquiry.id}"></td>
                <td th:text="${inquiry.title}"></td>
                <td class="content" th:text="${inquiry.content}"></td>
                <td><span class="badge" th:text="${inquiry.status.label}"></span></td>
                <td th:text="${#temporals.format(inquiry.createdAt, 'yyyy/MM/dd HH:mm')}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
